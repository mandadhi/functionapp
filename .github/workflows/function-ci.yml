name: Azure Function CI

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0'

  # Update these paths to match your repository.
  SOLUTION_PATH: 'Function-Apps-Pipeline.slnx'
  FUNCTION_PROJECT: 'Function-Apps-Pipeline.csproj'
  # TEST_PROJECT: 'tests/YourFunction.Tests/YourFunction.Tests.csproj'

  SONAR_PROJECT_KEY: 'mandadhi_functionapp'
  SONAR_ORGANIZATION: 'mandadhi'

jobs:
  ci:
    name: Lint, Security, Build, Test and Package
    runs-on: windows-latest

    steps:
      # 1. Checkout source
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Setup Java for SonarQube scanner
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # 4. Cache SonarQube Cloud packages
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\.sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      # 5. Install .NET tools
      - name: Install .NET tools
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool

      # 6. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      # 7. Verify code formatting
      - name: Verify code formatting
        run: |
          dotnet format "${{ env.SOLUTION_PATH }}" `
            --verify-no-changes `
            --no-restore

      # 8. Scan for secrets
      # - name: Scan repository for secrets
      #   uses: gitleaks/gitleaks-action@v3
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. Begin SonarQube Cloud analysis
      - name: Begin SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "SONAR_TOKEN is missing from GitHub repository secrets."
          }

          dotnet sonarscanner begin `
            /k:"${{ env.SONAR_PROJECT_KEY }}" `
            /o:"${{ env.SONAR_ORGANIZATION }}" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="coverage/coverage.opencover.xml" `
            /d:sonar.qualitygate.wait=true

      # 10. Build
      - name: Build solution
        run: |
          dotnet build "${{ env.SOLUTION_PATH }}" `
            --configuration Release `
            --no-restore

      # 11. Run tests and collect coverage
      # - name: Run unit tests
      #   run: |
      #     dotnet test "${{ env.TEST_PROJECT }}" `
      #       --configuration Release `
      #       --no-build `
      #       --logger "trx;LogFileName=test-results.trx" `
      #       --collect:"XPlat Code Coverage" `
      #       --results-directory ./TestResults `
      #       -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # 12. Generate coverage report
      # - name: Generate coverage report
      #   shell: pwsh
      #   run: |
      #     New-Item -ItemType Directory -Force -Path coverage | Out-Null

      #     reportgenerator `
      #       "-reports:TestResults/**/coverage.opencover.xml" `
      #       "-targetdir:coverage" `
      #       "-reporttypes:Html;Cobertura;Summary;TextSummary" `
      #       "-title:Azure Function Coverage"

      # # 13. Enforce line coverage strictly greater than 80%
      # - name: Enforce code coverage threshold
      #   shell: pwsh
      #   run: |
      #     $summaryPath = "coverage/Summary.xml"

      #     if (!(Test-Path $summaryPath)) {
      #       throw "Coverage summary was not generated."
      #     }

      #     [xml]$summary = Get-Content $summaryPath

      #     $coverageValue = $summary.SelectSingleNode(
      #       "//*[local-name()='Summary']"
      #     ).GetAttribute("linecoverage")

      #     if ([string]::IsNullOrWhiteSpace($coverageValue)) {
      #       throw "Line coverage was not found in the coverage summary."
      #     }

      #     $coverage = [double]::Parse(
      #       $coverageValue,
      #       [Globalization.CultureInfo]::InvariantCulture
      #     )

      #     Write-Host "Line coverage: $coverage%"
      #     Write-Host "Required: strictly greater than 80%"

      #     if ($coverage -le 80) {
      #       throw "Coverage requirement failed: $coverage% is not greater than 80%."
      #     }

      #     Write-Host "Coverage requirement passed."

      # 14. Finish SonarQube Cloud analysis
      - name: Finish SonarQube Cloud analysis
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      # 15. Publish Azure Function
      - name: Publish Azure Function
        if: success()
        run: |
          dotnet publish "${{ env.FUNCTION_PROJECT }}" `
            --configuration Release `
            --output ./publish

      # 16. Create deployment ZIP
      - name: Create deployment ZIP
        if: success()
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/* `
            -DestinationPath ./function-app.zip `
            -Force

          if (!(Test-Path ./function-app.zip)) {
            throw "Function App deployment ZIP was not generated."
          }

      # 17. Upload deployment artifact
      - name: Upload Function App artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: function-app-package
          path: function-app.zip
          if-no-files-found: error
          retention-days: 14

      # 18. Upload coverage report even if CI fails
      # - name: Upload coverage report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: function-coverage-report
      #     path: coverage/
      #     if-no-files-found: ignore
      #     retention-days: 14
