name: Azure Function CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: Function-Apps-Pipeline.slnx
  FUNCTION_PROJECT: Function-Apps-Pipeline.csproj
  SONAR_PROJECT_KEY: mandadhi_functionapp
  SONAR_ORGANIZATION: mandadhi

jobs:
  secret-scan:
    name: Scan repository secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: latest
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  ci:
    name: Format, build, analyze, and package
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: Function-Apps-Pipeline.csproj

      - name: Set up Java 21 for SonarScanner
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore solution dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}" -p:NuGetAuditMode=all -warnaserror:NU1903,NU1904

      - name: Verify code formatting
        run: dotnet format "${{ env.SOLUTION_PATH }}" --verify-no-changes --no-restore

      - name: Begin SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "SONAR_TOKEN is missing from GitHub repository secrets." >&2
            exit 1
          fi

          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /o:"${{ env.SONAR_ORGANIZATION }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true

      - name: Build solution in Release
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore

      - name: Finish SonarQube Cloud analysis and enforce Quality Gate
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publish Azure Function
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: dotnet publish "${{ env.FUNCTION_PROJECT }}" --configuration Release --no-build --no-restore --output ./publish

      - name: Create deployment ZIP with publish output at root
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: |
          test -f publish/host.json || { echo "Published output is missing host.json." >&2; exit 1; }
          cd publish
          zip -r ../function-app.zip .
          test -s ../function-app.zip || { echo "Function App deployment ZIP was not generated." >&2; exit 1; }

      - name: Upload Function App artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: actions/upload-artifact@v7
        with:
          name: function-app-package
          path: function-app.zip
          if-no-files-found: error
          retention-days: 14
