name: Azure Function CD

on:
  workflow_run:
    workflows:
      - Azure Function CI
    types:
      - completed
    branches:
      - dev
      - main

permissions:
  actions: read
  id-token: write

jobs:
  deploy:
    name: Deploy Azure Function
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["dev", "main"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'dev' }}
    env:
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Download package from triggering CI run
        uses: actions/download-artifact@v8
        with:
          name: function-app-package
          path: artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}


      - name: Confirm deployment target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_FUNCTIONAPP_NAME" || { echo "AZURE_FUNCTIONAPP_NAME is not configured for the selected GitHub Environment." >&2; exit 1; }
          echo "Source branch: $SOURCE_BRANCH"
          echo "Source commit: $SOURCE_SHA"
          echo "CI run ID: $SOURCE_RUN_ID"
          echo "GitHub Environment: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'dev' }}"
          echo "Target Function App: $AZURE_FUNCTIONAPP_NAME"

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./artifact/function-app.zip

      - name: Verify Function1 HTTP endpoint
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 "https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/Function1")
          test "$response" = "Welcome to Azure Functions!" || { echo "Function1 returned an unexpected response." >&2; exit 1; }