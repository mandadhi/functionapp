name: Azure Function CD

on:
  workflow_run:
    workflows:
      - Azure Function CI
    types:
      - completed
    branches:
      - dev
      - main

permissions:
  actions: read
  id-token: write

jobs:
  deploy:
    name: Deploy Azure Function
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["dev", "main"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'dev' }}
    env:
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Download package from triggering CI run
        uses: actions/download-artifact@v8
        with:
          name: function-app-package
          path: artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}


      - name: Confirm deployment target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_FUNCTIONAPP_NAME" || { echo "AZURE_FUNCTIONAPP_NAME is not configured for the selected GitHub Environment." >&2; exit 1; }
          echo "Source branch: $SOURCE_BRANCH"
          echo "Source commit: $SOURCE_SHA"
          echo "CI run ID: $SOURCE_RUN_ID"
          echo "GitHub Environment: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'dev' }}"
          echo "Target Function App: $AZURE_FUNCTIONAPP_NAME"

      - name: Azure login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./artifact/function-app.zip

            - name: Apply Function App Settings from JSON
        shell: bash
        env:
          FUNCTION_APP_SETTINGS_JSON: ${{ vars.FUNCTION_APP_SETTINGS_JSON }}
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail

          # Verify required configuration
          test -n "$AZURE_FUNCTIONAPP_NAME" || {
            echo "Function App name is missing." >&2
            exit 1
          }

          test -n "$AZURE_RESOURCE_GROUP" || {
            echo "Resource Group is missing." >&2
            exit 1
          }

          test -n "$FUNCTION_APP_SETTINGS_JSON" || {
            echo "FUNCTION_APP_SETTINGS_JSON is missing." >&2
            exit 1
          }

          # Convert JSON into individual Azure app settings
          SETTINGS=$(printf '%s' "$FUNCTION_APP_SETTINGS_JSON" | jq -er '
            if type != "object" then
              error("Expected a JSON object")
            elif length == 0 then
              error("JSON settings object must not be empty")
            else
              to_entries
              | map(
                  select(
                    (.key | type == "string") and
                    (.value | type == "string")
                  )
                  | "\(.key)=\(.value)"
                )
              | if length == 0 then
                  error("No valid string settings found")
                else
                  .[]
                end
            end
          ')

          # Apply each setting individually to Azure Function App
          mapfile -t SETTINGS_ARRAY <<< "$SETTINGS"

          az functionapp config appsettings set \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings "${SETTINGS_ARRAY[@]}" \
            --output none

          echo "Function App settings applied successfully."